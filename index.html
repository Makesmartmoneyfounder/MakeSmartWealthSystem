/* Make Smart Wealth Dashboard. Same visual language as the MSMP link-in-bio:
   Midnight Navy field, Electric Blue accents, Off White text, Slate for support copy. Gold only in the logo. */
:root {
  --navy: #0F172A; --navy-2: #131C32; --navy-3: #1A2541;
  --blue: #3B82F6; --blue-fill: #2563EB; --blue-2: #60A5FA; --blue-soft: rgba(59,130,246,.12);
  --off: #F1F5F9; --slate: #94A3B8; --slate-2: #CBD5E1;
  --line: rgba(148,163,184,.16); --line-2: rgba(148,163,184,.3);
  --good: #34D399; --warn: #FB923C; --bad: #F87171;
  --f-display: 'Inter Tight','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body: 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono: 'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--navy); }
body { margin: 0; background: var(--navy); color: var(--off); font-family: var(--f-body); font-size: 15px; line-height: 1.5; min-height: 100%; position: relative; overflow-x: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 14px; padding-bottom: 96px; }
body.noscroll { overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue-2); outline-offset: 2px; }
[hidden] { display: none !important; }
.field { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.field::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 44px 44px; opacity: .5;
  -webkit-mask-image: radial-gradient(ellipse 80% 55% at 50% 0%, #000 20%, transparent 75%); mask-image: radial-gradient(ellipse 80% 55% at 50% 0%, #000 20%, transparent 75%); }
.field::after { content: ""; position: absolute; left: 50%; top: -180px; width: 700px; height: 420px; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(59,130,246,.2), transparent); }

.shell { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 0 28px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 14px; grid-column: 1 / -1; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-2); flex: none; }
.brand b { display: block; font: 600 15px/1.15 var(--f-display); letter-spacing: -.01em; }
.brand small { display: block; font: 500 10.5px var(--f-mono); color: var(--slate); letter-spacing: .06em; text-transform: uppercase; }
.lang { display: flex; border: 1px solid var(--line-2); border-radius: 999px; padding: 2px; background: rgba(19,28,50,.7); }
.lang button { background: none; border: 0; border-radius: 999px; padding: 5px 11px; font: 500 11.5px var(--f-mono); color: var(--slate); letter-spacing: .04em; min-height: 30px; }
.lang button[aria-pressed="true"] { background: var(--blue-fill); color: #fff; }
.side { display: none; }
main { min-width: 0; }
.view { display: grid; gap: 14px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(6, 1fr); background: rgba(15,23,42,.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line-2); padding: 4px max(6px, env(safe-area-inset-right, 0px)) max(4px, env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
.tb { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 7px 2px; min-height: 52px; color: var(--slate); border-radius: 12px; font-size: 10.5px; font-weight: 500; text-align: center; }
.tb.on { color: var(--blue-2); background: var(--blue-soft); }
.shell.ob-mode ~ .tabs, .ob-mode .tabs { display: none; }

h1 { font: 650 26px/1.1 var(--f-display); letter-spacing: -.02em; margin: 0; }
h2 { font: 600 16px/1.25 var(--f-display); letter-spacing: -.01em; margin: 0; }
h3 { font: 600 14px/1.3 var(--f-display); margin: 14px 0 8px; }
p { margin: 0 0 8px; }
.eyebrow { font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--blue-2); margin: 0 0 6px; }
.lead { color: var(--slate-2); margin: -2px 0 2px; max-width: 62ch; }
.muted { color: var(--slate); } .sm { font-size: 13px; } .center { text-align: center; }
.neg { color: var(--bad) !important; } .posv { color: var(--good); }
.k { display: block; font: 500 10.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--slate); }
.lnk { background: none; border: 0; padding: 0; color: var(--blue-2); text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }
.vh { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 2px; }

.card { background: var(--navy-2); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.ch { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.ch .muted { font-size: 12.5px; }
.kpis { display: grid; grid-template-columns: 1fr; gap: 10px; }
.kpi b { display: block; font: 650 28px/1.15 var(--f-display); letter-spacing: -.02em; margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--slate); font-size: 12.5px; display: block; margin-top: 6px; }
.xpb { min-width: 150px; text-align: left; }
.xpn { font: 650 22px var(--f-display); } .xpn small { font: 500 11px var(--f-mono); color: var(--slate); }
.rk { display: block; font: 500 11px var(--f-mono); color: var(--blue-2); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }

.bar { height: 7px; background: rgba(148,163,184,.16); border-radius: 99px; overflow: hidden; margin: 6px 0; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue-fill), var(--blue-2)); border-radius: 99px; transition: width .5s ease; }
.bar.bad i { background: var(--bad); }
.chip { display: inline-flex; align-items: center; font: 500 10.5px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line-2); color: var(--slate-2); white-space: nowrap; }
.chip.done { color: var(--good); border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.08); }
.chip.active { color: var(--blue-2); border-color: rgba(96,165,250,.4); background: var(--blue-soft); }
.chip.warn { color: var(--warn); border-color: rgba(251,146,60,.45); background: rgba(251,146,60,.08); }
.chip.locked { color: var(--slate); }

.ladder { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ladder a { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 4px 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(26,37,65,.45); }
.ladder .why { grid-column: 1 / -1; color: var(--slate); font-size: 12px; padding-left: 42px; }
.capsp { padding-top: 6px; } .capsp b { display: block; font: 600 18px var(--f-display); margin-top: 4px; font-variant-numeric: tabular-nums; }
.ladder .bar { grid-column: 1 / -1; margin: 2px 0 0; height: 5px; }
.ladder .no, .lvh .no { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--blue-soft); color: var(--blue-2); font: 600 13px var(--f-mono); border: 1px solid rgba(96,165,250,.35); flex: none; }
.ladder .nm { font-weight: 600; font-size: 14px; }
.ladder .st { font: 500 10.5px var(--f-mono); color: var(--slate); text-transform: uppercase; letter-spacing: .05em; }
.ladder li.locked a { opacity: .6; } .ladder li.done .no { background: rgba(52,211,153,.12); color: var(--good); border-color: rgba(52,211,153,.4); }
.mv { font-size: 15.5px; color: var(--off); }
.alloc { list-style: none; margin: 0 0 8px; padding: 0; counter-reset: a; }
.alloc li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.alloc li::before { counter-increment: a; content: counter(a); font: 500 11px var(--f-mono); color: var(--blue-2); margin-right: 10px; align-self: center; }
.alloc li span { flex: 1; } .alloc b { font-variant-numeric: tabular-nums; }
.alerts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.alerts li { display: flex; gap: 10px; align-items: flex-start; }
.alerts .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--blue-2); margin-top: 7px; flex: none; }
.alerts .warn .dot { background: var(--warn); }
.alerts b { display: block; font-size: 14px; } .alerts p { color: var(--slate-2); font-size: 13.5px; margin: 2px 0 0; }
.nxt { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.nxt li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; } .nxt .bar { grid-column: 1 / -1; }
.nxt b { display: block; font-size: 14px; } .nxt span { color: var(--slate); font-size: 13px; } .nxt em { font: 500 11.5px var(--f-mono); color: var(--blue-2); font-style: normal; }

/* levels */
.lv { padding: 0; overflow: hidden; }
.lvh { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; background: none; border: 0; text-align: left; }
.lvh .lt { flex: 1; min-width: 0; } .lvh b { display: block; font: 600 15.5px var(--f-display); } .lvh small { color: var(--slate); font-size: 12.5px; display: block; }
.chev { transition: transform .2s; color: var(--slate); flex: none; } [aria-expanded="true"] .chev { transform: rotate(180deg); }

.x { background: none; border: 0; font-size: 26px; line-height: 1; color: var(--slate); width: 40px; height: 40px; }
.toast, #toast { position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 14px); max-width: min(92vw, 460px); background: var(--navy-3); border: 1px solid var(--line-2); color: var(--off); padding: 11px 16px; border-radius: 12px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: .25s; z-index: 60; box-shadow: 0 14px 34px -12px rgba(0,0,0,.6); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 640px) {
  body { padding-top: 22px; padding-bottom: 60px; }
  .kpis { grid-template-columns: repeat(3, 1fr); } .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); } .cols3 { grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .cal { grid-template-columns: repeat(12, 1fr); } .modal { align-items: center; padding: 20px; } .modal .card { border-radius: 18px; } h1 { font-size: 30px; }
}
@media (min-width: 960px) {
  .mobx { display: none; }
  .shell { grid-template-columns: 220px minmax(0, 1fr); }
  .side { display: grid; gap: 4px; align-content: start; position: sticky; top: 18px; height: fit-content; }
  .nv-group { display: grid; gap: 4px; }
  .nv-sub { margin-left: 24px; }
  .nv { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; color: var(--slate-2); font-weight: 500; font-size: 14px; }
  .nv:hover { background: rgba(26,37,65,.6); } .nv.on { background: var(--blue-soft); color: var(--blue-2); }
  .tabs { display: none; } body { padding-bottom: 60px; } #toast { bottom: 28px; }
  .ob-mode .side { display: none; } .ob-mode { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.qg{margin-top:14px;border:1px solid rgba(148,163,184,.16);border-radius:12px;overflow:hidden}.qgh{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:rgba(148,163,184,.08);font-size:.9rem}.qgh span{font-variant-numeric:tabular-nums;opacity:.85}.qr{display:grid;grid-template-columns:minmax(0,1fr) 8.5rem;gap:4px 10px;align-items:center;padding:9px 12px;border-top:1px solid rgba(148,163,184,.1)}.qg .qr:first-of-type{border-top:0}.qn{min-width:0;display:flex;flex-direction:column;gap:2px}.qn b{font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qn small{font-size:.74rem;opacity:.75;font-variant-numeric:tabular-nums}.qn small b{font-size:inherit;display:inline}.qt{display:inline-block;font-size:.66rem;font-weight:600;padding:1px 6px;margin-right:6px;border-radius:6px;background:rgba(148,163,184,.16);vertical-align:1px}.qr .inp input{width:100%;min-width:0;text-align:right;font-variant-numeric:tabular-nums}.qx{grid-column:1/-1;display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:.78rem;opacity:.9}.qx[hidden]{display:none}.qx .inp{width:8.5rem}.qadd{align-self:flex-start;background:none;border:0;color:#60a5fa;opacity:.85;font-size:.74rem;cursor:pointer;padding:2px 0 0;text-align:left}@media (max-width:480px){.qr{grid-template-columns:minmax(0,1fr) 7.2rem}.qx .inp{width:7.2rem}}.qadd:hover{opacity:1}.qup{color:#34d399}.vish{margin-top:18px}.goal.vis{opacity:.85;border-style:dashed}.eta{margin-top:6px}

  t1: 'Tasso di risparmio basso (sotto il 10%)', a1: 'Lavora prima su quello: taglia le spese e aumenta il tuo reddito.', w1: 'Il margine è la materia prima di tutto il sistema: se è troppo piccolo, nessuno strumento d’investimento può compensarlo. Le due leve che dipendono solo da te sono spese e reddito.', s1: 'Il tuo tasso di risparmio è {p}.', s1n: 'Inserisci entrate e spese per calcolarlo.',

cix: { eco: 'Il Check Up Mensile è il tuo Micro-Stato Economico: quanto entra, quanto esce, che margine resta. Il Micro-Stato Patrimoniale mostra cosa possiedi e cosa devi.', wt: 'Tieni traccia dei movimenti', wd: 'Registra ogni entrata e uscita in un’app come Wallet: a fine mese hai i totali veri da riportare qui, senza stimarli a memoria.', ww: 'Le spese ricordate a memoria tendono a essere più basse di quelle reali; un registro quotidiano toglie l’ipotesi.' },
me: { eyebrow: 'Il metodo', h1: 'Goal Based Investing', home: 'Perché 5 livelli? Leggi il metodo', pyAlt: 'Piramide a cinque livelli: il Livello 1 è la base, il Livello 5 la punta',
  lead: 'Investire partendo da che cosa devi finanziare e quando, non da che cosa sta facendo il mercato. Qui trovi l’idea a grandi linee e perché l’abbiamo scelta.',
  whatH: 'In breve: che cos’è',
  what: ['Ogni euro ha un obiettivo e una scadenza: sicurezza, casa, studi, pensione.', 'L’orizzonte temporale decide strumento e rischio, non l’umore del momento né la moda del mese.', 'Il successo si misura sull’obiettivo raggiunto, non sul “battere il mercato”.', 'Le regole si scrivono prima, a mercato calmo, per non dover decidere sotto stress.'],
  whyH: 'Perché lo adottiamo',
  why: [['Il rischio più grande è il comportamento.', 'Sapere cosa fare è facile a mercato calmo; il difficile è farlo quando il conto scende. Un piano legato agli obiettivi ti dà una risposta già scritta.'], ['Lo stesso crollo pesa in modo diverso.', 'Un −30% su soldi che ti servono tra 25 anni è un’oscillazione; su soldi che ti servono tra 2 anni è un problema. Il metodo separa i due casi.'], ['Dà un ordine.', 'Prima la sicurezza, poi gli obiettivi con scadenza, poi la crescita. Non devi indovinare dove mettere il prossimo euro: lo dice la piramide.'], ['È onesto.', 'Non promette rendimenti: dice solo quale strumento ha senso per quale scadenza.']],
  pyH: 'La piramide a 5 livelli', pyS: 'In basso ciò che non deve muoversi, in alto ciò che può oscillare. Si riempie dal basso.', pyN: 'Il Conto Corrente (1 mese di spese essenziali) è la cassa operativa alla base del Livello 1.',
  advH: 'I vantaggi del metodo a piramide',
  a1: { t: '1. Decisioni più razionali', p: 'Quando il mercato crolla del −30%, invece di andare in panico totale guardi la piramide e pensi:', l: ['“Ok, il mio Livello 3 è sceso del 30%. Ma il mio fondo di emergenza (Livello 1) è intatto.”', '“Gli obiettivi con scadenza vicina (Livello 2, ad esempio i BTP) sono su strumenti prudenti, allineati alla data. Anzi, forse posso trovare un po’ di soldi per approfittare dei saldi in borsa.”', '“Il Livello 3 mi serve tra 25 anni: ho tempo per recuperare.”'], r: 'Risultato: non vendi in panico. Anzi, magari compri di più mentre i prezzi sono bassi.', n: 'Per onestà: dopo un −30% serve circa +43% per tornare in pari, e nessuno garantisce che accada. Il tempo aumenta le probabilità di recupero, non le certezze. Il Livello 2 è meno esposto, non immune.' },
  a2: { t: '2. Maggiore disciplina', p: 'Quando sai che quei soldi servono per un obiettivo preciso, ad esempio la pensione di tua figlia tra 15 anni, sei molto più motivato a mantenere la strategia invece di “smanettare” continuamente.' },
  a3: { t: '3. Asset allocation personalizzata', p: 'Non esiste una sola ricetta. Due persone con lo stesso patrimonio possono avere piramidi completamente diverse in base ai loro obiettivi.' },
  prH: 'In pratica', prS: 'Stesso patrimonio, due piramidi diverse. Sono esempi illustrativi, non raccomandazioni.',
  pA: { t: 'Persona A · 28 anni', d: 'Reddito stabile, nessun obiettivo con scadenza entro 7 anni, orizzonte lungo.', l: ['Fondo di Sicurezza più snello: 3 mesi di spese essenziali, perché il reddito è stabile.', 'Livello 2 quasi vuoto: non ci sono obiettivi a medio termine.', 'Livello 3 molto più grande: il tempo lavora per lei.'] },
  pB: { t: 'Persona B · 45 anni', d: 'Reddito variabile, un anticipo per la casa tra 4 anni, la pensione tra 20.', l: ['Fondo di Sicurezza più alto: da 9 a 12 mesi, perché il reddito è meno prevedibile.', 'Livello 2 consistente: l’anticipo ha una data vicina.', 'Livello 3 più piccolo, pensato per l’obiettivo lontano.'] },
  limH: 'Cosa il metodo non fa', lim: ['Non promette rendimenti e non elimina il rischio.', 'Non dice che cosa comprare: dice a quale livello appartiene un obiettivo e che tipo di rischio è coerente.', 'Non sostituisce una consulenza personalizzata: è uno strumento educativo.'],
  cta: 'Passa all’azione', ctaD: 'Il metodo funziona solo se è tuo: scrivi i tuoi obiettivi e guarda cosa hai già.', ctaG: 'Scrivi un obiettivo', ctaB: 'Compila il Micro-Stato Patrimoniale' },

  rh: 'La routine mensile', r: ['Stessa data ogni mese, per esempio l’ultimo giorno.', 'Valori dalla stessa fonte: estratto o app del broker, alla chiusura dell’ultimo giorno di borsa.', 'Aggiorna cambi e prezzo del BTC.', 'Salva la fotografia, poi esporta il backup dalle Impostazioni.'],
  bk: 'Ultimo backup esportato: {d}.', bkOld: 'È passato più di un mese: esporta un nuovo backup dalle Impostazioni.', bkNever: 'Non hai ancora esportato un backup: i dati stanno solo in questo browser. Esportalo dalle Impostazioni.',
  sub: 'risparmio {s} · mercato e altro {m}', grow: 'Da dove arriva la crescita', growS: 'Dal primo all’ultimo salvataggio: quanto hai risparmiato tu (entrate − uscite dei Check Up Mensili) e quanto resta.', gTot: 'Variazione del patrimonio', gSav: 'Risparmio', gMkt: 'Mercato e altro', gMiss: 'Per vedere la scomposizione compila il Check Up Mensile di tutti i mesi tra i salvataggi.', gN: 'Il residuo comprende mercato, cambi, interessi, imposte e differenze di registrazione.' },
bsx: { fee: 'Costi di transazione pagati (facoltativo)', feeH: 'Commissioni del broker, spread pagato, imposte di bollo sull’acquisto, spese di notaio per un immobile: il totale pagato per questa voce. L’importo versato qui sopra va messo senza questi costi: la plus/minus li sottrae.', feeS: 'costi {v}', k6f: 'sulle voci con importo versato, al netto dei costi', iFee: 'Costi di transazione pagati: {v} su {n} voci.', iFeeP: 'Incidono per {p} su quanto hai investito.', iFeeW: 'Dal 1% in su vale la pena confrontare il broker o fare meno operazioni.', upd: 'agg. {d}', show: 'Mostra il patrimonio in', btcMiss: 'Per vedere il patrimonio in BTC inserisci il prezzo di 1 BTC in dollari.', goRates: 'Vai ai cambi', rates: 'Cambi usati: 1 € = {fx} $ · 1 BTC = {btc}', rt: 'Cambi', rtS: 'Servono per convertire tra euro, dollari e BTC. Li imposti tu e non si aggiornano da soli: aggiornali quando ti serve un valore preciso. Il costo d’acquisto viene convertito al cambio attuale: la plus/minus in euro non include l’effetto cambio tra l’acquisto e oggi. I valori sono inseriti a mano e non si aggiornano con il mercato: controlla la data “agg.” su ogni voce.', btc: 'Prezzo di 1 BTC in $', btcH: 'Per esempio il prezzo che vedi sul tuo exchange. Serve per le voci in BTC e per mostrare il patrimonio in BTC.', iBtc: 'Hai voci in BTC ma manca il prezzo di 1 BTC: finché non lo inserisci valgono zero.', valH: 'Nella valuta scelta sopra. Per i BTC scrivi la quantità (es. 0,05).', conv: 'Lo storico è salvato in euro e viene convertito ai cambi attuali.' },

  eb: { plan: '17 passi in 4 fasi', mindset: 'La testa prima degli strumenti', pac: 'Piano di accumulo', tax: 'Basi fiscali · Italia', taxfr: 'Basi fiscali · Francia' }, tc: { it: 'Italia', fr: 'Francia' },
  lead: { taxfr: 'Cosa devi sapere sulle tasse se vivi in Francia e investi, anche con broker esteri. Serve a capire, non sostituisce un professionista.', plan: 'Dalle fondamenta alla revisione annuale. Spunta i passi completati.', mindset: 'Scegliere 2–3 ETF e impostare un PAC è la parte facile. La parte difficile è non vendere quando il mercato crolla.', pac: 'Una somma fissa a intervalli regolari, qualunque cosa faccia il mercato. Costanza e automazione al posto del tempismo.', tax: 'Le basi fiscali di chi investe in Italia, ridotte all’essenziale. Servono a capire cosa succede ai tuoi guadagni, non sostituiscono un commercialista.' } },
ct: {
 taxfr: {"top": "Aggiornato a novembre 2026. Le regole fiscali francesi cambiano ogni anno con la legge di bilancio: prima di dichiarare verifica sempre su impots.gouv.fr. Sono informazioni generali, non una consulenza: per casi particolari serve un expert-comptable o un conseiller en gestion de patrimoine.", "s": [{"h": "1. Dove paghi le tasse", "b": [{"k": "p", "t": "Se vivi e lavori in Francia sei residente fiscale francese: casa principale, più di 183 giorni l’anno, lavoro principale o centro degli interessi economici in Francia. Da residente dichiari in Francia tutti i tuoi redditi mondiali, compresi interessi, dividendi e plusvalenze maturati su conti in Italia, Germania o Irlanda."}, {"k": "ul", "l": ["La convenzione Italia–Francia evita la doppia imposizione: lo stesso reddito non va tassato pieno in entrambi i paesi.", "Da italiano all’estero l’iscrizione all’AIRE è il passo che chiarisce anche per il fisco italiano che non sei più residente. Senza AIRE l’Italia può ancora considerarti residente e chiederti la dichiarazione dei conti esteri (quadro RW, IVAFE).", "La dichiarazione dei redditi francese si fa online in primavera (in genere da aprile a inizio giugno, con scadenze diverse per dipartimento) e riguarda l’anno precedente."]}]}, {"h": "2. La flat tax (PFU): 31,4% dal 2026", "b": [{"k": "p", "t": "Dividendi, interessi, plusvalenze su azioni ed ETF detenuti in un conto titoli ordinario e plusvalenze da crypto sono tassati di default con il prélèvement forfaitaire unique."}, {"k": "tbl", "h": ["Componente", "Prima", "Redditi 2026"], "r": [["Imposta sul reddito", "12,8%", "12,8%"], ["Prélèvements sociaux", "17,2%", "18,6%"], ["Totale PFU", "30%", "31,4%"]]}, {"k": "ul", "l": ["L’aumento viene dalla CSG (da 9,2% a 10,6%) ed è stato deciso con la legge di finanziamento della sicurezza sociale 2026.", "Restano al 17,2% di prélèvements sociaux l’assurance-vie, i PEL e i redditi immobiliari.", "In alternativa puoi scegliere l’opzione per il barème progressivo (casella 2OP). Vale per tutti i redditi del capitale dell’anno, non si sceglie voce per voce: in genere conviene solo se la tua aliquota marginale è 0% o 11%, perché dà l’abbattimento del 40% sui dividendi e rende deducibile una parte della CSG.", "Le minusvalenze si compensano con le plusvalenze dello stesso tipo e si riportano per 10 anni: tienine traccia."]}]}, {"h": "3. I contenitori fiscali francesi", "b": [{"k": "p", "t": "In Francia la stessa somma investita rende al netto in modo molto diverso a seconda di dove la tieni. Prima di scegliere lo strumento, scegli il contenitore."}, {"k": "tbl", "h": ["", "Cos’è", "Fiscalità", "Limiti"], "r": [["Livret A", "Libretto di risparmio garantito dallo Stato", "Esente da tutto. Tasso 1,7% dal 1° agosto 2026", "Versamenti fino a 22.950 €"], ["LDDS", "Libretto gemello del Livret A", "Esente da tutto. 1,7%", "Fino a 12.000 €"], ["LEP", "Libretto per redditi modesti", "Esente da tutto. 2,5%", "Fino a 10.000 €, solo sotto una soglia di reddito fiscale"], ["PEA", "Conto titoli per azioni ed ETF idonei (europei o replicanti indici mondiali)", "Dopo 5 anni: niente imposta sul reddito sui guadagni, solo prélèvements sociaux (18,6%)", "Versamenti fino a 150.000 €. Un prelievo prima dei 5 anni in genere chiude il piano"], ["Assurance-vie", "Contratto di investimento (fondi in euro garantiti e unità di conto)", "Dopo 8 anni: abbattimento annuo di 4.600 € di guadagni (9.200 € per una coppia), poi 7,5% + 17,2% sui guadagni ritirati", "Nessun tetto. Forte vantaggio anche in successione"], ["PER", "Piano di risparmio per la pensione", "Versamenti deducibili dal reddito imponibile entro un tetto. Tassazione all’uscita", "Bloccato fino alla pensione, salvo acquisto della residenza principale e casi eccezionali"], ["CTO", "Conto titoli ordinario: tutto è ammesso", "Flat tax 31,4% su dividendi, interessi e plusvalenze", "Nessuno"]]}, {"k": "note", "t": "I broker esteri (Interactive Brokers, Scalable Capital, Trade Republic con IBAN tedesco) sono in pratica dei CTO: nessun vantaggio fiscale francese."}]}, {"h": "4. Conti e broker all’estero: l’obbligo da non dimenticare", "b": [{"k": "p", "t": "Ogni conto aperto fuori dalla Francia va dichiarato ogni anno con il modulo 3916 / 3916-bis, insieme alla dichiarazione dei redditi (casella 8UU). Vale anche per i conti vuoti, quelli usati poco e quelli chiusi durante l’anno. Lo stesso vale per i conti crypto all’estero."}, {"k": "ul", "l": ["Sanzione: 1.500 € per ogni conto non dichiarato e per ogni anno (10.000 € se il conto è in uno Stato non cooperativo).", "Servono: nome esatto dell’istituto, paese, indirizzo, numero del conto, data di apertura (ed eventualmente di chiusura).", "Trade Republic: con IBAN francese è un’entità francese (niente 3916 e IFU fornito); con IBAN tedesco va dichiarato.", "Un broker estero non trattiene le imposte francesi e non ti dà l’IFU (il riepilogo fiscale francese): dividendi, interessi e plusvalenze li riporti tu, partendo dal suo resoconto annuale.", "Dividendi e interessi esteri vanno anche nel modulo 2047; le plusvalenze su titoli nel modulo 2074. I dividendi in valuta si convertono in euro al cambio BCE del giorno di incasso.", "Sui dividendi esteri il paese d’origine trattiene spesso un’imposta alla fonte (per esempio il 15% sulle azioni USA con il modulo W-8BEN): la convenzione ti dà un credito d’imposta in Francia, così non paghi due volte.", "Per i redditi pagati da un istituto estero è previsto in teoria il versamento di un acconto del 12,8% più i prélèvements sociaux entro il 15 del mese successivo (modulo 2778-DIV per i dividendi). Chi ha un reddito fiscale sotto le soglie di legge può chiedere la dispensa entro il 30 novembre per l’anno dopo: verifica la tua situazione."]}]}, {"h": "5. Come si traduce sui tuoi livelli", "b": [{"k": "p", "t": "Indicazioni di metodo, non consigli personalizzati: confronta sempre i rendimenti netti, non quelli lordi."}, {"k": "tbl", "h": ["Livello", "Contenitore da considerare", "Perché"], "r": [["Conto Corrente", "Conto corrente francese", "Liquidità quotidiana, nessuna fiscalità"], ["Livello 1 · Sicurezza", "Livret A, LDDS (e LEP se ne hai diritto)", "Liquidi, garantiti e senza tasse: un monetario su un CTO estero paga il 31,4% sui guadagni, quindi rende meno di quanto sembra"], ["Livello 2 · Protezione", "Assurance-vie (fondi in euro), libretti, obbligazioni", "Capitale protetto per obiettivi a 2–7 anni; l’assurance-vie diventa conveniente dopo 8 anni"], ["Livello 3 · Crescita", "PEA con ETF idonei", "Dopo 5 anni solo il 18,6% sui guadagni invece del 31,4%: su 20 anni la differenza è grande"], ["Livelli 4–5", "CTO (anche estero)", "Libertà di strumenti; le perdite compensano i guadagni per 10 anni"]]}, {"k": "note", "w": true, "t": "Spostare investimenti già fatti da un CTO a un PEA vuol dire vendere (e pagare le tasse sulle plusvalenze) e ricomprare. Valuta prima di tutto dove indirizzare i nuovi versamenti."}]}, {"h": "6. Calendario e checklist annuale", "b": [{"k": "ul", "l": ["Gennaio–marzo: scarica i resoconti fiscali annuali di ogni broker e banca, francesi ed esteri.", "Aprile–giugno: dichiarazione dei redditi online, con 3916-bis per ogni conto estero, 2047 per i redditi esteri, 2074 per le plusvalenze e le minusvalenze da riportare.", "Estate: avviso d’imposta. Le imposte sui redditi da investimenti si pagano in genere a fine estate o in autunno.", "Entro il 30 novembre: eventuale richiesta di dispensa dagli acconti sui redditi finanziari per l’anno successivo.", "28 dicembre, revisione annuale: verifica che ogni conto estero sia nella lista da dichiarare e che i nuovi versamenti vadano nel contenitore giusto."]}]}, {"h": "7. Gli errori più comuni", "b": [{"k": "ul", "l": ["Dimenticare il 3916-bis per un broker estero o per un conto chiuso nell’anno.", "Dichiarare i dividendi esteri senza il credito d’imposta, e pagarli quindi due volte.", "Scegliere il barème progressivo pensando di poterlo applicare solo ad alcuni redditi: vale per tutti.", "Prelevare dal PEA prima dei 5 anni, perdendo il vantaggio e chiudendo il piano.", "Tenere il fondo di emergenza su strumenti tassati quando esistono libretti esenti con rendimento netto simile o migliore.", "Dimenticare di riportare le minusvalenze degli anni precedenti."]}]}]},
 mindset: { s: [
  { h: 'Perché il cervello ti sabota', b: [
   { k: 'p', t: 'Il cervello si è evoluto per sopravvivere, non per gestire i mercati: produce errori sistematici (bias) sempre uguali. Questi sono i 6 che costano di più.' },
   { k: 'cards', l: [
    { t: 'Avversione alle perdite', d: 'Perdere 100 € pesa psicologicamente circa il doppio di guadagnarne 100. Vendi in perdita “per fermare il dolore” e blocchi un calo che sarebbe stato temporaneo.', a: 'decidi le regole prima, nel piano di crisi.' },
    { t: 'Recency bias', d: 'Dai troppo peso agli ultimi mesi e poco agli ultimi vent’anni. Dopo sei mesi di rialzi pensi che “sale sempre” e compri al massimo: a fine 2021 molti lo pensavano, nel 2022 i mercati azionari sono scesi di circa il 20%.', a: 'guarda grafici a 20 anni, non a 20 giorni.' },
    { t: 'Confirmation bias', d: 'Cerchi solo le informazioni che confermano ciò che già pensi e ignori gli avvisi, finché il prezzo non crolla.', a: 'cerca attivamente le ragioni contrarie prima di comprare.' },
    { t: 'FOMO', d: 'Vedere gli altri guadagnare mentre tu stai fermo è psicologicamente devastante. Nel 2017 con Bitcoin intorno ai 20.000 $ e nel 2021 con crypto e titoli “meme”, molti sono entrati al picco e hanno perso fino al 70–90%. Quando tutti ne parlano e sembri l’unico fuori, spesso sei già in ritardo.', a: 'ciò che non è nel piano non si compra.' },
    { t: 'Mentalità del gregge', d: 'Segui la massa. I flussi verso i fondi azionari tendono a toccare il massimo vicino ai massimi di mercato e il minimo vicino ai minimi: si compra caro e si vende a sconto.', a: 'automatizza: il PAC non guarda la folla.' },
    { t: 'Vendita in panico', d: 'Il mercato scende del 20% in poche settimane, i titoli parlano di “nuova crisi”, pensi “almeno salvo qualcosa”. Vendi, il mercato recupera, hai venduto al minimo. Studi come quelli di Dalbar stimano che l’investitore medio resti indietro di alcuni punti l’anno rispetto all’indice proprio per questo (la metodologia è discussa, la direzione no).', a: 'segui il protocollo qui sotto.' }
   ] }
  ] },
  { h: 'Aspettati i crolli prima che arrivino', b: [
   { k: 'ul', l: ['Storicamente: cali del 10% ogni uno-due anni, del 20% ogni qualche anno, del 30–40% di rado ma succede. Sono normali, non eccezioni (dato indicativo, cambia con mercato e periodo).', 'I grandi indici azionari sono sempre tornati ai massimi, ma i tempi cambiano molto: 2020 pochi mesi, 2008 circa 5 anni, 1929 circa 25 anni, il Nikkei dopo il 1989 oltre 30 anni.'] },
   { k: 'note', w: true, t: 'Il recupero passato non è una garanzia. Per questo il Livello 3 va finanziato solo con soldi che non ti servono per 10 anni o più.' }
  ] },
  { h: 'Prima, durante e dopo un crollo', b: [
   { k: 'cols', l: [
    { t: 'Prima', l: ['Piramide costruita bene: Livelli 1 e 2 solidi, asset volatili solo nel Livello 3.', 'Scrivi il piano di crisi con le soglie −20, −30, −40%.', 'Stress test mentale: immagina il portafoglio a −40%. Se non sai se reggeresti, forse hai troppo rischio.'] },
    { t: 'Durante', l: ['Non guardare il portafoglio ogni giorno: notifiche spente, controllo al massimo una volta al mese.', 'Evita le notizie finanziarie: i titoli catastrofici vendono click.', 'Rileggi il piano scritto quando eri lucido: fidati del te razionale, non di quello emotivo.', 'Parla con qualcuno che non è in panico.'] },
    { t: 'Dopo', l: ['Analizza cosa hai fatto: hai venduto, resistito, comprato?', 'Se non reggi la volatilità, il Livello 3 è troppo grande: meglio meno azioni e dormire che più azioni e vendere in panico.'] }
   ] }
  ] },
  { h: 'Il potere della noia', b: [
   { k: 'p', t: 'Investire bene è noioso: lo stesso ETF ogni mese per anni, niente trading, niente titolo caldo, niente notizie ossessive, niente di figo da raccontare agli amici. Chi fa meno operazioni evita gli errori di tempismo.' },
   { k: 'ul', l: ['Controlli il portafoglio dieci volte al giorno, compri e vendi di continuo, cerchi il “prossimo Bitcoin”? Fermati: stai sbagliando qualcosa.', 'Scegli la strategia, automatizzala, dimenticala per anni.'] },
   { k: 'note', t: 'Fare meno non garantisce di più: riduce gli errori comportamentali, non il rischio di mercato.' }
  ] }
 ] },
 pac: { s: [
  { h: 'Come funziona', b: [
   { k: 'p', t: 'Investi una somma fissa a intervalli regolari (ad esempio 200 € ogni 1° del mese in un ETF azionario globale), per 10, 20, 30 anni, senza guardare cosa ha fatto il mercato quel giorno. Il principio si chiama dollar cost averaging: quando il prezzo è alto compri meno quote, quando è basso ne compri di più.' },
   { k: 'tbl', h: ['Mese', 'Prezzo (esempio)', 'Quote con 200 €'], r: [['1', '50 €', '4,00'], ['2', '40 €', '5,00'], ['3', '45 €', '4,44'], ['4', '35 €', '5,71'], ['5', '50 €', '4,00'], ['6', '55 €', '3,64']] },
   { k: 'p', t: 'Investiti 1.200 €, comprate 26,79 quote: prezzo medio pagato 44,79 €, contro un prezzo medio di mercato di 45,83 €.' }
  ] },
  { h: 'I vantaggi', b: [
   { k: 'ul', l: ['Psicologico: entrare con 200 € al mese fa meno paura che mettere 20.000 € in un colpo e ti abitua alla volatilità.', 'Nei ribassi compri più quote: a marzo 2020 gli indici azionari sono scesi di circa il 34% in poco più di un mese e nel giro di pochi mesi hanno recuperato.', 'Niente timing: nessuno sa qual è il momento giusto, tu compri sempre.', 'Disciplina: se è automatico, investi anche quando hai paura, sei in vacanza o ti sei dimenticato.', 'Scalabile: parti da 50 € e aumenti quando cresce il reddito.'] }
  ] },
  { h: 'Gli svantaggi da conoscere', b: [
   { k: 'ul', l: ['In media l’ingresso unico (lump sum) batte il PAC: circa due volte su tre secondo uno studio Vanguard su finestre di 12 mesi, perché i mercati salgono più spesso di quanto scendono e hai più capitale investito più a lungo. Nelle crisi e nei mercati laterali può succedere l’opposto.', 'Costi: con 5–10 € a ordine, 120 acquisti in 10 anni sono fino a 1.200 €. Scegli broker con PAC a commissioni basse o zero.', 'Frustrazione: in un lungo rialzo compri sempre più caro. Ma se il rialzo continua, stai comunque guadagnando.'] },
   { k: 'note', t: 'Nessuno sa se il mercato salirà o scenderà: le statistiche passate descrivono, non prevedono.' }
  ] },
  { h: 'PAC, tutto subito o via di mezzo?', b: [
   { k: 'cols', l: [
    { t: 'Tutto subito se', l: ['hai esperienza e la volatilità non ti spaventa', 'reggeresti un −30/−40% senza vendere', 'i soldi non servono per almeno 10 anni'] },
    { t: 'PAC se', l: ['parti da zero con i soli risparmi mensili', 'la volatilità ti mette ansia', 'vuoi entrare gradualmente e automatizzare', 'il mercato è salito molto e temi di comprare al picco'] },
    { t: 'Ibrido, con una somma importante', l: ['investi subito il 30–50%', 'il resto con un PAC in 12–24 mesi', 'esempio: 20.000 € = 8.000 € subito + 500 € al mese per 24 mesi'] }
   ] },
   { k: 'note', t: 'L’ibrido è una scelta di metodo, non un obbligo: riduce il rischio di entrare tutto al picco senza restare troppo a lungo fuori dal mercato.' }
  ] },
  { h: 'Un esempio di implementazione', b: [
   { k: 'p', t: 'Strumento: ETF azionario globale ad accumulazione, per la massima semplicità. Esempio con 400 € al mese, il giorno 5 (dopo l’accredito dello stipendio):' },
   { k: 'cols', l: [
    { t: 'Allocazione A · semplice', l: ['400 € · Vanguard FTSE All-World (VWCE, IE00BK5BQT80)'] },
    { t: 'Allocazione B · più volatilità', l: ['200 € · Vanguard FTSE All-World (VWCE)', '100 € · iShares Core MSCI Emerging Markets IMI (EIMI, IE00BKM4GZ66)', '100 € · iShares Nasdaq 100 (CSNDX, IE00B53SZB19)'] }
   ] },
   { k: 'p', t: 'Proiezione ipotetica: 400 € al mese per 35 anni con un rendimento medio del 7% annuo = 168.000 € versati e circa 720.000 € finali. È un’ipotesi, non una previsione: ignora costi, tasse e inflazione, e i rendimenti reali oscillano.' },
   { k: 'note', w: true, t: 'Sono esempi usati nel metodo, non raccomandazioni personalizzate. Prima di acquistare controlla costi (TER), replica, domicilio e KID di ogni ETF.' }
  ] },
  { h: 'Nelle situazioni difficili', b: [
   { k: 'ul', l: ['Mercato a −40%: non cambi nulla, continui ad accumulare. I prezzi sono scontati.', 'Mercato a +50%: non cambi nulla, continui. Le oscillazioni sono rumore.', 'Perdi il lavoro o ti servono soldi: prima dal Livello 1, poi dal Livello 2. Il Livello 3 si tocca solo se non c’è alternativa.'] }
  ] },
  { h: 'Errori comuni', b: [
   { k: 'ul', l: ['Fermare il PAC quando il mercato crolla: è il momento in cui compra a sconto.', 'Aumentarlo nei rialzi e ridurlo nei ribassi: è umano, ma è l’opposto di ciò che serve. Fisso e automatico.', 'Controllare il portafoglio ogni giorno.', 'Scegliere troppi strumenti.', 'Non aumentarlo quando cresce il reddito: destina almeno il 50% di ogni aumento stabile.'] }
  ] },
  { h: 'Come impostarlo', b: [
   { k: 'ul', l: ['Broker: regolamentato in Europa, commissioni basse o zero sul PAC, ampia scelta di ETF, acquisti automatici, interfaccia semplice.', 'Strumenti: 1–3 ETF azionari ad accumulazione con TER basso (indicativamente 0,3% o meno). Se quotati in euro eviti il cambio al broker, ma il rischio valuta dei titoli sottostanti resta.', 'Automazione: bonifico automatico ricorrente dal conto corrente al broker, qualche giorno prima della data del PAC. Imposti una volta e dimentichi.'] }
  ] }
 ] },
 tax: { top: 'Valgono le regole italiane. Se hai residenza fiscale in Francia o altrove, la tassazione è diversa: verifica con un professionista locale. Aliquote e scadenze cambiano: controlla sempre quelle in vigore.', s: [
  { h: 'Cosa paghi', b: [
   { k: 'ul', l: ['Imposta sui redditi finanziari: 26% su plusvalenze, dividendi e interessi. 12,5% su titoli di Stato italiani e di Paesi white list (negli ETF obbligazionari vale per la quota di titoli di Stato).', 'Imposta di bollo sul deposito titoli: 0,2% annuo sul valore di mercato al 31 dicembre.'] },
   { k: 'p', t: 'Il capital gain si tassa solo quando vendi e realizzi il guadagno. Il bollo si paga ogni anno.' },
   { k: 'p', t: 'Esempio: 10.000 € in un ETF azionario globale, venduti dopo 3 anni a 13.000 €. Plusvalenza 3.000 € × 26% = 780 €. Bollo circa 78 € (0,2% × 13.000 × 3; in realtà si calcola ogni anno sul valore al 31/12). Totale circa 858 €, netto 12.142 €: +21,4% in 3 anni (circa 6,7% annuo) invece di +30%.' }
  ] },
  { h: 'Amministrato o dichiarativo', b: [
   { k: 'p', t: 'Quando apri un conto titoli ti trovi in uno di due regimi.' },
   { k: 'tbl', h: ['', 'Amministrato', 'Dichiarativo'], r: [['Chi calcola e paga', 'Il broker', 'Tu o il commercialista'], ['Quando paghi', 'Subito, alla vendita', 'Entro giugno dell’anno dopo'], ['Dichiarazione', 'Non serve per questi redditi', 'Obbligatoria (quadro RT)'], ['Compensazione minus', 'Solo nello stesso broker', 'Anche tra broker diversi'], ['Broker', 'Solo con sede o succursale in Italia', 'Tutti, anche esteri'], ['Costo', 'Nessun commercialista', 'Circa 200–500 €/anno se non sei pratico'], ['Per chi', 'Principianti, portafogli semplici', 'Esperti, molti broker, portafogli grandi']] },
   { k: 'ul', l: ['Amministrato: zero burocrazia e zero rischio di errori, ma paghi subito e hai meno flessibilità.', 'Dichiarativo: paghi dopo (6–18 mesi di liquidità in più da reinvestire) e puoi ottimizzare, ma se sbagli la dichiarazione il problema è tuo.', 'Con broker esteri (dichiarativo) di norma vanno dichiarati anche i conti esteri (quadro RW) e si applica l’IVAFE: parlane con un commercialista.'] },
   { k: 'note', t: 'Regola pratica del metodo: principiante, portafoglio sotto 100.000 € e poche operazioni → amministrato. Oltre 100.000 € e molte operazioni → valuta il dichiarativo, mettendo in conto il commercialista. Se non sai cos’è il quadro RT né come si compila un F24, non scegliere il dichiarativo.' }
  ] },
  { h: 'Le minusvalenze', b: [
   { k: 'ul', l: ['Una vendita in perdita può compensare plusvalenze future, ma solo entro 4 anni: poi scade.', 'Esempio: anno 1 vendi A con −2.000 €; anno 2 vendi B con +5.000 €. Paghi 26% su 3.000 € = 780 € invece di 1.300 €: risparmi 520 €.'] },
   { k: 'note', w: true, t: 'Le minusvalenze NON si compensano con le plusvalenze di fondi ed ETF: sono redditi di capitale, non “redditi diversi”. La compensazione riguarda soprattutto azioni e titoli singoli.' }
  ] },
  { h: 'Errori comuni', b: [
   { k: 'ul', l: ['Non sapere in che regime sei: controlla il contratto o chiedi al broker.', 'Vendere a fine anno solo per “fare minus”: costi di transazione e, con gli ETF, la minus non è comunque compensabile. Se ricompri subito lo stesso titolo il fisco può contestarlo.', 'Dimenticare il bollo: 100.000 € di titoli = 200 € l’anno, 500.000 € = 1.000 € l’anno.', 'Non conservare i documenti: rendiconti annuali, estratti conto, ricevute dei bonifici, per almeno 5 anni.', 'Scegliere il dichiarativo senza competenze.'] }
  ] }
 ] },
 plan: { ph: [
  { h: 'Fase 1 · Costruisci le fondamenta', s: [
   { n: 1, t: 'Fai il check-up', d: 'Il punto A della mappa. Compila Micro-Stato Economico (tasso di risparmio = (entrate − uscite) ÷ entrate) e Micro-Stato Patrimoniale (patrimonio netto = attivi − passivi).', l: ['Tasso di risparmio basso: prima lavora su entrate e spese.', 'Debiti costosi: valuta di estinguerli prima.', 'Hai già investimenti: leggi il rendiconto MiFID dei costi. Sotto lo 0,5% l’anno è ottimo, 0,5–1% accettabile, 1–2% troppo, oltre il 2% va cambiato.'], g: ['checkin', 'balance'] },
   { n: 2, t: 'Definisci gli obiettivi', d: 'Non partire dagli strumenti: parti da dove vuoi arrivare. Per ogni obiettivo rispondi alle 7 domande (dove, di quanto, entro quando, quanto hai già, quanto puoi versare, quanto rischio, come). Nella domanda sul rischio trovi già i tre rischi: voglio, posso, devo.', n2: 'Un investimento senza obiettivo è capitale senza una funzione: ogni euro deve sapere che lavoro fa.', g: ['goals'] },
   { n: 3, t: 'Definisci i tre rischi', d: 'Prima di trasformare gli obiettivi in un piano, per ogni obiettivo accorda tre rischi diversi:', l: ['Rischio che voglio: quanto ne desideri psicologicamente.', 'Rischio che posso: dipende da orizzonte, stabilità economica, patrimonio e necessità futura del capitale.', 'Rischio che devo: quanto serve per rendere raggiungibile l’obiettivo.'], n2: 'Non prendere più rischio solo perché l’obiettivo è ambizioso. Se serve un rendimento irrealistico, il problema è versamento, scadenza o importo.', g: ['goals'] },
   { n: 4, t: 'Trasforma gli obiettivi in un piano', d: 'Confronta capitale necessario, capitale attuale, versamento mensile e scadenza: il piano è realistico? Se no, cambia il piano, non l’obiettivo.', l: ['Esempio: 25.000 € entro due anni con 3.000 € già messi e 350 € al mese. In 24 mesi versi 8.400 €, in totale circa 11.400 €: non basta, servono più tempo o più versamento.', 'Le leve: versamento, reddito, scadenza, importo.', 'Usa le tue spese reali, un obiettivo alla volta. Il piano cresce con il tuo reddito.'], g: ['goals'] }
  ] },
  { h: 'Fase 2 · Costruisci la strategia', s: [
   { n: 5, t: 'Comprendi la piramide', d: 'Tre funzioni: proteggere ciò che hai, finanziare obiettivi certi, far crescere ciò che ancora non hai. Il modello di base ha 3 livelli; la dashboard affianca altri due fondi (Speculazione, Tools AI & Fintech).', l: ['Livello 1 · Fondo di Sicurezza (0–2 anni): imprevisti, perdita del reddito, spese urgenti. Rischio praticamente nullo. Dimensione: spese essenziali mensili × 3, 6, 9 o 12 mesi (reddito molto stabile → autonomo o molto variabile). Strumenti: conto corrente, conto deposito svincolabile, ETF monetari. Funzioni: precauzionale, psicologica (non vendi nei ribassi), liquidità.', 'Livello 2 · Fondo di protezione (2–7 anni): obiettivi relativamente certi come casa, matrimonio, figli, auto. Rischio basso o moderato, in base a scadenza e flessibilità. Strumenti: obbligazioni, titoli di Stato, ETF obbligazionari, eventualmente indicizzati all’inflazione.', 'Livello 3 · Fondo di Crescita (10+ anni): indipendenza finanziaria, pensione, patrimonio per i figli. Rischio più elevato: il tempo permette di attraversare cicli e cali. Strumenti: ETF azionari, oro, Bitcoin, altri fattori o asset class coerenti.'], g: ['levels'] },
   { n: 6, t: 'Costruisci la tua piramide', d: 'Assegna ogni obiettivo al livello giusto. Non chiederti “quale ETF compro?”, chiediti “quale livello deve finanziare questo obiettivo?”.', l: ['Fondo di emergenza → Livello 1', 'Matrimonio tra 5 anni → Livello 2', 'Libertà finanziaria tra 15–20 anni → Livello 3'], g: ['goals', 'levels'] },
   { n: 7, t: 'Definisci l’allocazione del risparmio', d: 'Dove vanno i soldi che metti da parte ogni mese? Con 550 € potresti avere per ora 350 € al Livello 1, 100 € al Livello 2 e 100 € al Livello 3. Quando un obiettivo si completa il suo versamento si libera e passa ai successivi: il sistema è dinamico.', g: ['home'] },
   { n: 8, t: 'Definisci l’asset allocation obiettivo', d: 'Solo ora la struttura di lungo periodo: azioni, obbligazioni, oro, Bitcoin, liquidità. Le percentuali derivano da obiettivi, orizzonte, rischio e capacità finanziaria, non da ciò che sta andando meglio in quel momento.' }
  ] },
  { h: 'Fase 3 · Implementa il piano', s: [
   { n: 9, t: 'Scegli gli strumenti', d: 'Ogni strumento deve risolvere un problema preciso. Se non sai spiegare in una frase perché lo possiedi, probabilmente non ti serve. Portafoglio il più semplice possibile.', g: ['levels', 'pac'] },
   { n: 10, t: 'Scegli il broker e apri il conto', d: 'Criteri:', l: ['Regolamentato in Europa (CONSOB o equivalente UE).', 'Commissioni basse o zero sul PAC, ampia scelta di ETF, interfaccia semplice, app funzionante.', 'Principiante, portafoglio sotto 100.000 €, poche operazioni: regime amministrato. La semplicità vale più di qualche euro risparmiato.', 'Esperto, oltre 100.000 € e molte operazioni: valuta il dichiarativo, mettendo in conto il commercialista.'], g: ['tax'] },
   { n: 11, t: 'Implementa i livelli', d: 'Attiva gli strumenti del Livello 1, costruisci il Livello 2 per i medio termine, attiva il PAC del Livello 3. Non serve completare tutto il Livello 1 prima di versare un piccolo importo nel Livello 3, ma la protezione resta prioritaria all’inizio.', g: ['levels'] },
   { n: 12, t: 'Automatizza e dimentica', d: 'Bonifici automatici, PAC automatici, trasferimenti verso i livelli. Controllo periodico solo per verificare che i versamenti siano avvenuti, che gli obiettivi siano ancora validi e che non siano cambiate condizioni importanti.', n2: 'Evita: controllo quotidiano, compravendite impulsive, modifiche continue, inseguimento delle performance, strumenti senza una funzione precisa.', g: ['pac'] }
  ] },
  { h: 'Fase 4 · Fai evolvere il sistema', s: [
   { n: 13, t: 'Aumenta la capacità di investimento', d: 'Il patrimonio non cresce solo con il rendimento, ma con quanto capitale aggiungi. Regola: almeno il 50% di ogni aumento stabile del reddito va al patrimonio (+500 €/mese di reddito → almeno +250 €/mese investiti). Il tenore di vita migliora senza che tutta la crescita sia assorbita dalla lifestyle inflation.' },
   { n: 14, t: 'Piano operativo a 12 mesi', d: 'Cosa deve succedere nei prossimi 12 mesi: capacità di risparmio, PAC totale, allocazione tra i livelli, capitale target a fine anno, obiettivi da completare, aumento desiderato della capacità di investimento.' },
   { n: 15, t: 'Obiettivo patrimoniale a 24 mesi', d: 'Dove dovrebbe essere il tuo patrimonio tra 24 mesi se segui il piano? Patrimonio totale, Fondo di Sicurezza, capitale dei Livelli 2 e 3, PAC mensile raggiunto. Una milestone intermedia concreta.', g: ['balance'] },
   { n: 16, t: 'Piano di crescita della capacità', d: 'Il PAC non resta identico per decenni: costruisci una traiettoria. Più che una cifra fissa, può essere una percentuale di reddito (“aumenterò gradualmente la quota investita, tenendo sotto controllo lo stile di vita”).' },
   { n: 17, t: 'Rivedi il piano ogni anno', d: 'La strategia non cambia perché cambia il mercato: cambia quando cambia la tua vita. Revisione almeno annuale.', l: ['Obiettivi e scadenze ancora validi? Capitale target corretto?', 'PAC aumentato? Rischio e asset allocation coerenti?', 'Costi competitivi? Fondo di Sicurezza sufficiente? Sostenibilità degli obiettivi migliorata?', 'Da rivedere subito se: matrimonio, nascita di un figlio, cambio lavoro o passaggio ad autonomo, aumento importante del reddito, acquisto casa, eredità.'] }
  ] }
 ], end: 'Non costruire un portafoglio e poi chiederti a cosa servirà. Costruisci prima la tua vita finanziaria e lascia che sia quella a determinare il portafoglio.' }
}

  t1: 'Taux d’épargne faible (moins de 10 %)', a1: 'Travaille d’abord là-dessus : réduis tes dépenses et augmente ton revenu.', w1: 'La marge est la matière première de tout le système : si elle est trop petite, aucun investissement ne peut la compenser. Les deux leviers qui ne dépendent que de toi sont les dépenses et le revenu.', s1: 'Ton taux d’épargne est de {p}.', s1n: 'Saisis revenus et dépenses pour le calculer.',

cix: { eco: 'Le check-up mensuel est ton micro-état économique : ce qui entre, ce qui sort, la marge qui reste. Le micro-bilan patrimonial montre ce que tu possèdes et ce que tu dois.', wt: 'Suis tes mouvements', wd: 'Note chaque entrée et sortie d’argent dans une app comme Wallet : en fin de mois, tu as les vrais totaux à reporter ici, sans les estimer de mémoire.', ww: 'Les dépenses retrouvées de mémoire tendent à être plus basses que les réelles ; un suivi quotidien supprime l’hypothèse.' },
me: { eyebrow: 'La méthode', h1: 'Goal Based Investing', home: 'Pourquoi 5 niveaux ? Lis la méthode', pyAlt: 'Pyramide à cinq niveaux : le Niveau 1 est la base, le Niveau 5 le sommet',
  lead: 'Investir en partant de ce que tu dois financer et de quand, pas de ce que fait le marché. Voici l’idée en grandes lignes et pourquoi nous l’avons choisie.',
  whatH: 'En bref : de quoi s’agit-il',
  what: ['Chaque euro a un objectif et une échéance : sécurité, logement, études, retraite.', 'L’horizon de temps décide du support et du risque, pas l’humeur du moment ni la mode du mois.', 'Le succès se mesure à l’objectif atteint, pas au fait de « battre le marché ».', 'Les règles s’écrivent avant, quand le marché est calme, pour ne pas décider sous stress.'],
  whyH: 'Pourquoi nous l’adoptons',
  why: [['Le plus grand risque, c’est le comportement.', 'Savoir quoi faire est facile quand le marché est calme ; le difficile, c’est de le faire quand le compte baisse. Un plan lié aux objectifs te donne une réponse déjà écrite.'], ['La même chute ne pèse pas pareil.', 'Un −30 % sur de l’argent dont tu as besoin dans 25 ans est une fluctuation ; sur de l’argent dont tu as besoin dans 2 ans, c’est un problème. La méthode sépare les deux cas.'], ['Elle donne un ordre.', 'D’abord la sécurité, puis les objectifs datés, puis la croissance. Tu n’as pas à deviner où placer le prochain euro : la pyramide le dit.'], ['Elle est honnête.', 'Elle ne promet aucun rendement : elle dit seulement quel support a du sens pour quelle échéance.']],
  pyH: 'La pyramide à 5 niveaux', pyS: 'En bas ce qui ne doit pas bouger, en haut ce qui peut fluctuer. On la remplit par le bas.', pyN: 'Le compte courant (1 mois de dépenses essentielles) est la trésorerie opérationnelle à la base du Niveau 1.',
  advH: 'Les avantages de la méthode en pyramide',
  a1: { t: '1. Des décisions plus rationnelles', p: 'Quand le marché chute de 30 %, au lieu de paniquer tu regardes la pyramide et tu te dis :', l: ['« Ok, mon Niveau 3 a baissé de 30 %. Mais mon fonds d’urgence (Niveau 1) est intact. »', '« Les objectifs à échéance proche (Niveau 2, par exemple des obligations d’État) sont sur des supports prudents, alignés sur la date. Peut-être même que je peux trouver un peu d’argent pour profiter des soldes en bourse. »', '« Le Niveau 3, j’en ai besoin dans 25 ans : j’ai le temps de récupérer. »'], r: 'Résultat : tu ne vends pas dans la panique. Peut-être même que tu achètes davantage pendant que les prix sont bas.', n: 'Pour être honnête : après un −30 %, il faut environ +43 % pour revenir à l’équilibre, et rien ne garantit que cela arrive. Le temps augmente les chances de récupération, pas les certitudes. Le Niveau 2 est moins exposé, pas à l’abri.' },
  a2: { t: '2. Plus de discipline', p: 'Quand tu sais que cet argent sert un objectif précis, par exemple la retraite de ta fille dans 15 ans, tu es bien plus motivé à tenir la stratégie plutôt que de « bidouiller » sans arrêt.' },
  a3: { t: '3. Une allocation d’actifs personnalisée', p: 'Il n’existe pas une seule recette. Deux personnes avec le même patrimoine peuvent avoir des pyramides complètement différentes selon leurs objectifs.' },
  prH: 'En pratique', prS: 'Même patrimoine, deux pyramides différentes. Ce sont des exemples illustratifs, pas des recommandations.',
  pA: { t: 'Personne A · 28 ans', d: 'Revenu stable, aucun objectif à échéance sous 7 ans, horizon long.', l: ['Fonds de sécurité plus léger : 3 mois de dépenses essentielles, car le revenu est stable.', 'Niveau 2 presque vide : pas d’objectifs à moyen terme.', 'Niveau 3 bien plus grand : le temps travaille pour elle.'] },
  pB: { t: 'Personne B · 45 ans', d: 'Revenu variable, un apport pour un logement dans 4 ans, la retraite dans 20.', l: ['Fonds de sécurité plus élevé : de 9 à 12 mois, car le revenu est moins prévisible.', 'Niveau 2 conséquent : l’apport a une date proche.', 'Niveau 3 plus petit, pensé pour l’objectif lointain.'] },
  limH: 'Ce que la méthode ne fait pas', lim: ['Elle ne promet aucun rendement et n’élimine pas le risque.', 'Elle ne dit pas quoi acheter : elle dit à quel niveau appartient un objectif et quel type de risque est cohérent.', 'Elle ne remplace pas un conseil personnalisé : c’est un outil pédagogique.'],
  cta: 'Passe à l’action', ctaD: 'La méthode ne marche que si elle est la tienne : écris tes objectifs et regarde ce que tu as déjà.', ctaG: 'Écrire un objectif', ctaB: 'Remplir le micro-bilan patrimonial' },

me: { eyebrow: 'The method', h1: 'Goal Based Investing', home: 'Why 5 levels? Read the method', pyAlt: 'Five-level pyramid: Level 1 is the base, Level 5 the tip',
  lead: 'Investing starting from what you need to fund and when, not from what the market is doing. Here is the idea in broad strokes and why we chose it.',
  whatH: 'In short: what it is',
  what: ['Every euro has a goal and a deadline: safety, home, education, retirement.', 'The time horizon decides the instrument and the risk, not the mood of the moment or this month’s fashion.', 'Success is measured by the goal reached, not by “beating the market”.', 'Rules are written beforehand, when the market is calm, so you don’t decide under stress.'],
  whyH: 'Why we adopt it',
  why: [['The biggest risk is behaviour.', 'Knowing what to do is easy when the market is calm; the hard part is doing it when your account is falling. A plan tied to goals gives you an answer already written.'], ['The same crash weighs differently.', 'A −30% on money you need in 25 years is a fluctuation; on money you need in 2 years it is a problem. The method separates the two cases.'], ['It gives an order.', 'Safety first, then dated goals, then growth. You don’t have to guess where the next euro goes: the pyramid tells you.'], ['It is honest.', 'It promises no returns: it only says which instrument makes sense for which deadline.']],
  pyH: 'The 5-level pyramid', pyS: 'At the bottom what must not move, at the top what can swing. You fill it from the bottom.', pyN: 'The current account (1 month of essential expenses) is the operating cash at the base of Level 1.',
  advH: 'Advantages of the pyramid method',
  a1: { t: '1. More rational decisions', p: 'When the market falls 30%, instead of total panic you look at the pyramid and think:', l: ['“Ok, my Level 3 is down 30%. But my emergency fund (Level 1) is intact.”', '“Goals with a near deadline (Level 2, for example government bonds) are in prudent instruments aligned to the date. Maybe I can even find a bit of money to take advantage of the stock-market sale.”', '“I need Level 3 in 25 years: I have time to recover.”'], r: 'Result: you don’t sell in panic. You might even buy more while prices are low.', n: 'To be honest: after a −30% you need about +43% to get back to even, and nobody guarantees it will happen. Time raises the odds of recovery, not the certainty. Level 2 is less exposed, not immune.' },
  a2: { t: '2. More discipline', p: 'When you know that money is for a specific goal, for example your daughter’s retirement in 15 years, you are far more motivated to keep to the strategy instead of constantly tinkering.' },
  a3: { t: '3. Personalised asset allocation', p: 'There is no single recipe. Two people with the same wealth can have completely different pyramids depending on their goals.' },
  prH: 'In practice', prS: 'Same wealth, two different pyramids. These are illustrative examples, not recommendations.',
  pA: { t: 'Person A · 28 years old', d: 'Stable income, no goals due within 7 years, long horizon.', l: ['Leaner Safety Fund: 3 months of essential expenses, because income is stable.', 'Level 2 almost empty: no medium-term goals.', 'Much larger Level 3: time works for them.'] },
  pB: { t: 'Person B · 45 years old', d: 'Variable income, a house deposit in 4 years, retirement in 20.', l: ['Higher Safety Fund: 9 to 12 months, because income is less predictable.', 'Substantial Level 2: the deposit has a near date.', 'Smaller Level 3, built for the distant goal.'] },
  limH: 'What the method does not do', lim: ['It promises no returns and does not remove risk.', 'It doesn’t tell you what to buy: it tells you which level a goal belongs to and what kind of risk is consistent.', 'It does not replace personalised advice: it is an educational tool.'],
  cta: 'Take action', ctaD: 'The method only works if it is yours: write your goals and look at what you already have.', ctaG: 'Write a goal', ctaB: 'Fill in the Micro Balance Sheet' },
